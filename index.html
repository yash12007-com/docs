<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yash12007 Docs</title>
    <link rel="shortcut icon" href="https://www.yash12007.com/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --accent: #00eeff;
            --surface: #111;
            --border: rgba(255, 255, 255, 0.1);
            --muted: #9aa3ad;
        }
        body {
            margin: 0;
            font-family: system-ui;
            background: var(--bg);
            color: var(--text);
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 55px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }
        main {
            max-width: 1100px;
            margin: 80px auto;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
        }
        .section {
            margin-top: 40px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
        }
        .overview { color: var(--muted); max-width: 720px; line-height: 1.6; }
        .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .doc-card { display: flex; flex-direction: column; gap: 12px; min-height: 150px; }
        .doc-card h2 { margin: 0; font-size: 1.2rem; }
        .doc-card p { color: var(--muted); line-height: 1.5; margin: 0; flex: 1; }
        .category { color: var(--accent); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .error { color: #ff8f8f; }
        ul {
            padding-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,
        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }
        img {
            max-width: 230px;
            border-radius: 10px;
        }a{color: #0ef; text-decoration: none; cursor: pointer;}
    </style>
</head>
<body>
    <nav>
        <img src="https://www.yash12007.com/192x192.png" alt="Yash12007 Logo" width="30" height="30" style="margin: 8px; border-radius: 50%;">
        <strong>Yash12007 Docs</strong>
    </nav>
    <main id="app">
        <h1>Loading...</h1>
    </main>
    <script>
        const app = document.getElementById("app");
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        loadContent();

        async function loadContent() {
            try {
                if (!id || id === "index" || id === "docs") {
                    const response = await fetch(new URL("docs.json", document.baseURI));
                    if (!response.ok) throw new Error("Overview not found");
                    renderOverview(await response.json());
                    return;
                }

                const response = await fetch(new URL(`${encodeURIComponent(id)}.json`, document.baseURI));
                if (!response.ok) throw new Error("Document not found");
                render(await response.json());
            } catch (error) {
                app.innerHTML = `<h1>Unable to load documentation</h1><p class="error">${error.message}</p>`;
            }
        }

        function renderOverview(data) {
            document.title = data.title;
            app.innerHTML = `<h1>${data.title}</h1><p class="overview">${data.subtitle || data.description || ""}</p>`;

            const section = document.createElement("section");
            section.className = "section";
            section.innerHTML = "<h2>Documentation overview</h2>";

            const grid = document.createElement("div");
            grid.className = "doc-grid";
            (data.docs || []).forEach(doc => {
                const card = document.createElement("article");
                card.className = "card doc-card";
                card.innerHTML = `<span class="category">${doc.category || "Documentation"}</span><h2></h2><p></p><a>Open documentation &rarr;</a>`;
                card.querySelector("h2").textContent = doc.title;
                card.querySelector("p").textContent = doc.description || "Explore this documentation.";
                card.querySelector("a").href = new URL(doc.path, document.baseURI).href;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            app.appendChild(section);
        }
        function render(data) {
            app.innerHTML = "";
            const title = document.createElement("h1");
            title.textContent = data.title;
            document.title=data.title+" Documentation";
            app.appendChild(title);
            if (data.subtitle) {
                const sub = document.createElement("p");
                sub.style.color = "#888";
                sub.textContent = data.subtitle;
                app.appendChild(sub);
            }
            data.sections.forEach((sec, index) => {
                const wrapper = document.createElement("div");
                wrapper.className = "section";
                if (sec.title) {
                    const h = document.createElement("h"+(index+1));
                    h.textContent = sec.title;
                    wrapper.appendChild(h);
                }
                const card = document.createElement("div");
                card.className = "card";
                switch (sec.type) {
                    case "text":
                        const p = document.createElement("p");
                        p.innerHTML = sec.content.replace("\n", "<br><br>");
                        card.appendChild(p);
                        break;
                    case "image":
                        const img = document.createElement("img");
                        img.src = sec.src;
                        card.appendChild(img);
                        break;
                    case "list":
                        const ul = document.createElement("ul");
                        sec.items.forEach(i => {
                            const li = document.createElement("li");
                            li.innerHTML = i;
                            ul.appendChild(li);
                        });
                        card.appendChild(ul);
                        break;
                    case "table":
                        const table = document.createElement("table");
                        const thead = document.createElement("thead");
                        const trh = document.createElement("tr");
                        sec.headers.forEach(h => {
                            const th = document.createElement("th");
                            th.textContent = h;
                            trh.appendChild(th);
                        });
                        thead.appendChild(trh);
                        table.appendChild(thead);
                        const tbody = document.createElement("tbody");
                        sec.rows.forEach(row => {
                            const tr = document.createElement("tr");
                            row.forEach(cell => {
                                const td = document.createElement("td");
                                td.textContent = cell;
                                tr.appendChild(td);
                            });
                            tbody.appendChild(tr);
                        });
                        table.appendChild(tbody);
                        card.appendChild(table);
                        break;
                    
                }
                wrapper.appendChild(card);
                app.appendChild(wrapper);
            });
        }
    </script>

</body>

</html>
